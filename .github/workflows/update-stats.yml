name: Update README Stats # Final Sync Fix v2

on:
  push:
    branches: [main]
    paths:
      - 'llm/**'
      - '.github/workflows/update-stats.yml'
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Update README with Amplitude stats
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_QUERY_KEY: ${{ secrets.AMPLITUDE_QUERY_KEY }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, sys, time, re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          README    = Path("README.md")
          HEADER    = "## API Usage Statistics"
          TW_TZ     = timezone(timedelta(hours=8))
          AS_OF = datetime.now(TW_TZ)
          PERIOD_START = (AS_OF - timedelta(days=364)).strftime("%Y%m%d")  # 365 calendar dates, inclusive of today
          APP_COLORS = ["blue", "green", "orange", "red", "purple", "yellowgreen", "cyan", "teal", "pink", "indigo"]
          CHART_COLORS = ["#1A6CF7", "#00C2A0", "#F7931A", "#A456F0", "#FF5733", "#20B2AA", "#E91E63", "#9C27B0", "#673AB7", "#3F51B5"]

          SERVICE_MODELS = {
              "Gemini API (Direct)": ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-2.5-flash-lite"],
              "Llm-Cli-APIServer": ["codex", "chatgpt-pro"],
              "Local Inference (MLX/Whisper/OCR)": [
                  "mlx-qwen3", "mlx-gemma4", "whisper-large-v3", "baidu/Unlimited-OCR",
                  "mlx-community/whisper-large-v3-turbo", "whisper-large-v3-turbo", "distil-whisper-large-v3"
              ]
          }
          OVERVIEW_SVG_BY_APP   = "assets/chart_overview_by_app_7d.svg"
          OVERVIEW_SVG_BY_MODEL = "assets/chart_overview_by_model_7d.svg"
          TOTAL_SVG_BY_APP      = "assets/chart_total_by_app.svg"
          TOTAL_SVG_BY_MODEL    = "assets/chart_total_by_model.svg"

          def amp_get(api_key, secret_key, params):
              url = "https://amplitude.com/api/2/events/segmentation?" + urlencode(params)
              creds = base64.b64encode(f"{api_key}:{secret_key}".encode()).decode()
              req = Request(url, headers={"Authorization": f"Basic {creds}"})
              for attempt in range(5):
                  try:
                      time.sleep(3)
                      with urlopen(req, timeout=30) as r: return json.loads(r.read())
                  except HTTPError as e:
                      if e.code == 429:
                          time.sleep((attempt + 1) * 20); continue
                      raise
              raise Exception("Amplitude API failed")

          def query_total_calls(api_key, secret_key, days=None, offset_days=0, model_filter=None):
              end_dt = AS_OF - timedelta(days=offset_days)
              start = (end_dt - timedelta(days=days-1)).strftime("%Y%m%d") if days else PERIOD_START
              event_def = {"event_type": "llm_call"}
              if model_filter: event_def["filters"] = [{"subprop_type": "event", "subprop_key": "model", "subprop_op": "is", "subprop_value": model_filter}]
              params = {"e": json.dumps(event_def), "start": start, "end": end_dt.strftime("%Y%m%d"), "m": "totals", "i": "1"}
              try:
                  data = amp_get(api_key, secret_key, params)
                  return sum(sum(s) for s in data.get("data", {}).get("series", [[]]) if s)
              except: return 0

          def query_daily_series(api_key, secret_key, days, model_filter=None):
              end_dt = AS_OF; start_dt = end_dt - timedelta(days=days-1)
              event_def = {"event_type": "llm_call"}
              if model_filter: event_def["filters"] = [{"subprop_type": "event", "subprop_key": "model", "subprop_op": "is", "subprop_value": model_filter}]
              params = {"e": json.dumps(event_def), "start": start_dt.strftime("%Y%m%d"), "end": end_dt.strftime("%Y%m%d"), "m": "totals", "i": "1"}
              try:
                  data = amp_get(api_key, secret_key, params)
                  return data.get("data", {}).get("series", [[]])[0]
              except: return [0] * days

          def normalize_group_label(label, group_props):
              if isinstance(group_props, str): group_props = [group_props]
              values = []
              def collect_strings(value):
                  if isinstance(value, (list, tuple)):
                      for item in value: collect_strings(item)
                  elif isinstance(value, str) and value.strip() and value.strip().lower() not in {"(none)", "(not set)", "none"}:
                      values.append(value.strip())
              collect_strings(label)
              parts = []
              for index, prop in enumerate(group_props):
                  if index < len(values):
                      parts.append(values[index])
                  else:
                      parts.append("(missing app_name)" if prop == "app_name" else "(unknown)")
              return tuple(parts) if len(parts) > 1 else parts[0]

          def query_grouped(api_key, secret_key, group_prop, model_filter=None, days=None, extra_filters=None, second_group_prop=None):
              end_dt = AS_OF
              start = (end_dt - timedelta(days=days-1)).strftime("%Y%m%d") if days else PERIOD_START
              group_props = [group_prop] + ([second_group_prop] if second_group_prop else [])
              event_def = {"event_type": "llm_call", "group_by": [{"type": "event", "value": prop} for prop in group_props]}
              filters = []
              if model_filter: filters.append({"subprop_type": "event", "subprop_key": "model", "subprop_op": "is", "subprop_value": model_filter})
              if extra_filters: filters.extend(extra_filters)
              if filters: event_def["filters"] = filters
              params = {"e": json.dumps(event_def), "start": start, "end": end_dt.strftime("%Y%m%d"), "m": "totals", "i": "1", "limit": "1000"}
              data = amp_get(api_key, secret_key, params)
              series, labels, result = data.get("data", {}).get("series", []), data.get("data", {}).get("seriesLabels", []), {}
              for i, label in enumerate(labels):
                  if i < len(series):
                      label = normalize_group_label(label, group_props)
                      total = sum(v for v in series[i] if v is not None)
                      if total > 0: result[label] = int(total)
              return result

          def query_last7days(api_key, secret_key, model_names, group_by="app_name"):
              end_dt = AS_OF; start_dt = end_dt - timedelta(days=6)
              event_def = {"event_type": "llm_call", "filters": [{"subprop_type": "event", "subprop_key": "model", "subprop_op": "is", "subprop_value": model_names}], "group_by": [{"type": "event", "value": group_by}]}
              params = {"e": json.dumps(event_def), "start": start_dt.strftime("%Y%m%d"), "end": end_dt.strftime("%Y%m%d"), "m": "totals", "i": "1", "limit": "1000"}
              data = amp_get(api_key, secret_key, params)
              series, labels, xvals, result = data.get("data", {}).get("series", []), data.get("data", {}).get("seriesLabels", []), data.get("data", {}).get("xValues", []), {}
              for i, label in enumerate(labels):
                  if i < len(series):
                      label = normalize_group_label(label, group_by)
                      result[label] = [v if v is not None else 0 for v in series[i]]
              return xvals, result

          def generate_stacked_bar_svg(title, xdates, series, filepath):
              import math
              W, H, ML, MR, MT, MB = 900, 420, 65, 20, 55, 85; CW, CH = W - ML - MR, H - MT - MB
              short_dates = [d[5:].replace("-", "/") if len(d) >= 10 else d for d in xdates]; n = len(short_dates)
              if n == 0 or not series: return
              group_names = list(series.keys()); data = [[int(series[a][i]) if i < len(series[a]) else 0 for i in range(n)] for a in group_names]
              max_val = max(1, max([sum(data[j][i] for j in range(len(group_names))) for i in range(n)]) if n > 0 else 1)
              mag = 10 ** max(0, math.floor(math.log10(max_val))); y_ceil = math.ceil(max_val * 1.15 / mag) * mag
              TICKS = 5; step = y_ceil / TICKS; esc = lambda s: s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")
              sv = [f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}">', f'<rect width="{W}" height="{H}" fill="white"/>', f'<text x="{W//2}" y="34" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial,sans-serif" fill="#1a1a2e">{esc(title)}</text>']
              for k in range(TICKS + 1):
                  val = k * step; gy = MT + CH - int(val / y_ceil * CH)
                  sv.append(f'<line x1="{ML}" y1="{gy}" x2="{ML+CW}" y2="{gy}" stroke="#EEEEEE" stroke-width="1"/>')
                  sv.append(f'<text x="{ML-6}" y="{gy+4}" text-anchor="end" font-size="10" font-family="Arial,sans-serif" fill="#666">{int(val)}</text>')
              for i in range(n):
                  bx, bot = ML + i * (CW / n) + (CW / n * 0.2), MT + CH
                  for j in range(len(group_names)):
                      val = data[j][i]
                      if val > 0:
                          bh = val / y_ceil * CH; sv.append(f'<rect x="{bx:.1f}" y="{(bot-bh):.1f}" width="{(CW/n*0.6):.1f}" height="{bh:.1f}" fill="{CHART_COLORS[j % len(CHART_COLORS)]}"/>'); bot -= bh
                  sv.append(f'<text x="{(ML + i * (CW / n) + (CW / n) / 2):.1f}" y="{MT+CH+16}" text-anchor="middle" font-size="10" font-family="Arial,sans-serif" fill="#666">{esc(short_dates[i])}</text>')
              legend_y = MT + CH + 35; legend_x = ML
              for j, group in enumerate(group_names):
                  tw = len(group) * 7 + 25
                  if legend_x + tw > W - MR: legend_x = ML; legend_y += 18
                  sv.append(f'<rect x="{legend_x}" y="{legend_y}" width="10" height="10" rx="2" fill="{CHART_COLORS[j % len(CHART_COLORS)]}"/>')
                  sv.append(f'<text x="{legend_x+16}" y="{legend_y+9}" font-size="11" font-family="Arial,sans-serif" fill="#444">{esc(group)}</text>')
                  legend_x += tw
              sv.append('</svg>'); os.makedirs(os.path.dirname(filepath) or ".", exist_ok=True)
              with open(filepath, "w", encoding="utf-8") as f: f.write("\n".join(sv))

          def generate_totals_bar_svg(title, data, filepath, top_n=15):
              esc = lambda s: str(s).replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")
              items = sorted(data.items(), key=lambda x: -x[1])[:top_n]
              n = len(items)
              if n == 0: return
              W, ML, MR, MT, row_h, gap = 900, 220, 70, 55, 26, 8
              H = MT + n * (row_h + gap) + 20
              CW = W - ML - MR
              max_val = max(v for _, v in items) or 1
              sv = [f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}">',
                    f'<rect width="{W}" height="{H}" fill="white"/>',
                    f'<text x="{W//2}" y="34" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial,sans-serif" fill="#1a1a2e">{esc(title)}</text>']
              for i, (label, val) in enumerate(items):
                  y = MT + i * (row_h + gap)
                  bw = max(2, val / max_val * CW)
                  color = CHART_COLORS[i % len(CHART_COLORS)]
                  sv.append(f'<text x="{ML-10}" y="{y+row_h*0.65:.1f}" text-anchor="end" font-size="12" font-family="Arial,sans-serif" fill="#333">{esc(label)}</text>')
                  sv.append(f'<rect x="{ML}" y="{y}" width="{bw:.1f}" height="{row_h}" rx="3" fill="{color}"/>')
                  sv.append(f'<text x="{ML+bw+8:.1f}" y="{y+row_h*0.65:.1f}" font-size="12" font-family="Arial,sans-serif" fill="#444">{val}</text>')
              sv.append('</svg>')
              os.makedirs(os.path.dirname(filepath) or ".", exist_ok=True)
              with open(filepath, "w", encoding="utf-8") as f: f.write("\n".join(sv))

          def badge(label, message, color): return f"![](https://img.shields.io/badge/{label.replace('-','--').replace(' ','_')}-{message.replace('-','--').replace(' ','_')}-{color})"

          api_key, secret_key = os.environ["AMPLITUDE_API_KEY"], os.environ["AMPLITUDE_QUERY_KEY"]
          all_models = [m for svc in SERVICE_MODELS.values() for m in svc]
          m_counts = query_grouped(api_key, secret_key, "model")
          m_counts_7d = query_grouped(api_key, secret_key, "model", days=7)
          m_counts_24h = query_grouped(api_key, secret_key, "model", days=1)
          daily = query_daily_series(api_key, secret_key, days=14, model_filter=all_models)
          recent = {"total": query_total_calls(api_key, secret_key, model_filter=all_models), "24h": daily[-1], "prev_24h": daily[-2], "7d": sum(daily[-7:]), "prev_7d": sum(daily[-14:-7])}

          now_tw = AS_OF.strftime('%Y-%m-%d %H:%M CST')
          lines = [HEADER, "", f"*Powered by [Amplitude Analytics](https://amplitude.com) · Updated: {now_tw}*", ""]
          # Badges on separate lines as requested
          lines += [
              badge("Past_365_Calendar_Days", f"{recent['total']}", "black"),
              badge("Last_7_Calendar_Days", f"{recent['7d']}", "blue"),
              badge("Today", f"{recent['24h']}", "green"),
              "",
              "*Periods use the Amplitude project timezone: past 365 calendar dates, the last 7 calendar dates, and today (a partial day). Events without `app_name` are shown as `(missing app_name)`. Duration is omitted until the API query can be reported accurately.*",
              ""
          ]

          # --- Overview charts (combined across all services, replaces one per-service pair) ---
          ov_app_xdates, ov_app = query_last7days(api_key, secret_key, all_models, group_by="app_name")
          if ov_app_xdates and ov_app:
              generate_stacked_bar_svg("Total events by App (Last 7 Calendar Days)", ov_app_xdates, ov_app, OVERVIEW_SVG_BY_APP)
              lines += ["", f"![](./{OVERVIEW_SVG_BY_APP})"]
          ov_model_xdates, ov_model = query_last7days(api_key, secret_key, all_models, group_by="model")
          if ov_model_xdates and ov_model:
              generate_stacked_bar_svg("Total events by Model (Last 7 Calendar Days)", ov_model_xdates, ov_model, OVERVIEW_SVG_BY_MODEL)
              lines += ["", f"![](./{OVERVIEW_SVG_BY_MODEL})"]

          # --- Total (past 365 calendar days) charts, by App and by Model ---
          total_by_app = query_grouped(api_key, secret_key, "app_name", model_filter=all_models)
          if total_by_app:
              generate_totals_bar_svg("Events by App (Past 365 Calendar Days)", total_by_app, TOTAL_SVG_BY_APP)
              lines += ["", f"![](./{TOTAL_SVG_BY_APP})"]
          total_by_model = {m: c for m, c in m_counts.items() if m in all_models}
          if total_by_model:
              generate_totals_bar_svg("Events by Model (Past 365 Calendar Days)", total_by_model, TOTAL_SVG_BY_MODEL)
              lines += ["", f"![](./{TOTAL_SVG_BY_MODEL})"]
          lines += ["", ""]

          # --- Smart Routing Section ---
          sr_stats = query_grouped(api_key, secret_key, "smart_route_status")
          if sr_stats:
              sr_7d = query_grouped(api_key, secret_key, "smart_route_status", days=7)
              sr_24h = query_grouped(api_key, secret_key, "smart_route_status", days=1)
              lines += ["### Smart Routing (Efficiency)", "", "| Status | Past 365 Calendar Days | Last 7 Calendar Days | Today | Description |", "|--------|------------------------|--------------------|-------|-------------|"]
              status_map = {
                  "judged_passed": "Draft Passed",
                  "judged_failed": "Judge Replaced",
                  "draft_failed": "Fallback (Error)",
                  "server_side_executed": "NAS Reflection"
              }
              desc_map = {
                  "judged_passed": "Saved powerful model cost.",
                  "judged_failed": "Corrected by powerful model.",
                  "draft_failed": "Automatic fallback to Gemini.",
                  "server_side_executed": "App used draft_provider='codex'; draft+judge ran entirely on NAS via gemini-cli."
              }
              for k, label in status_map.items():
                  lines.append(f"| {label} | {sr_stats.get(k, 0)} | {sr_7d.get(k, 0)} | {sr_24h.get(k, 0)} | {desc_map.get(k, '')} |")

              sr_filter = [{"subprop_type": "event", "subprop_key": "smart_route_status", "subprop_op": "is", "subprop_value": list(status_map.keys())}]
              sr_apps = query_grouped(api_key, secret_key, "app_name", extra_filters=sr_filter)
              if sr_apps:
                  sr_apps_7d = query_grouped(api_key, secret_key, "app_name", extra_filters=sr_filter, days=7)
                  sr_apps_24h = query_grouped(api_key, secret_key, "app_name", extra_filters=sr_filter, days=1)
                  lines += ["", "#### Smart Routing by Application", "", "| App | Past 365 Calendar Days | Last 7 Calendar Days | Today |", "|-----|------------------------|--------------------|-------|"]
                  for app, count in sorted(sr_apps.items(), key=lambda x: -x[1]):
                      c7d = sr_apps_7d.get(app, 0); c24h = sr_apps_24h.get(app, 0)
                      lines.append(f"| {app} | {count} | {c7d} | {c24h} |")
              lines += ["", ""]

          for svc, models in SERVICE_MODELS.items():
              svc_m = {m: m_counts[m] for m in models if m in m_counts}
              if not svc_m: continue
              lines += [f"### {svc}", "", "| Model | Past 365 Calendar Days | Last 7 Calendar Days | Today |", "|-------|------------------------|--------------------|-------|"]
              for m, count in sorted(svc_m.items(), key=lambda x: -x[1]):
                  c7d = m_counts_7d.get(m, 0); c24h = m_counts_24h.get(m, 0)
                  lines.append(f"| `{m}` | {count} | {c7d} | {c24h} |")

              svc_apps = query_grouped(api_key, secret_key, "app_name", model_filter=list(models))
              svc_apps_7d = query_grouped(api_key, secret_key, "app_name", model_filter=list(models), days=7)
              svc_apps_24h = query_grouped(api_key, secret_key, "app_name", model_filter=list(models), days=1)
              svc_app_models = svc_app_models_7d = svc_app_models_today = {}
              if svc == "Local Inference (MLX/Whisper/OCR)":
                  svc_app_models = query_grouped(api_key, secret_key, "app_name", model_filter=list(models), second_group_prop="model")
                  svc_app_models_7d = query_grouped(api_key, secret_key, "app_name", model_filter=list(models), days=7, second_group_prop="model")
                  svc_app_models_today = query_grouped(api_key, secret_key, "app_name", model_filter=list(models), days=1, second_group_prop="model")

              if svc_apps:
                  lines += ["", "#### All Applications", "", "| Application | Past 365 Calendar Days | Last 7 Calendar Days | Today |", "|-------------|------------------------|--------------------|-------|"]
                  sorted_apps = sorted(svc_apps.items(), key=lambda x: -x[1])
                  for app, count in sorted_apps:
                      c7d = svc_apps_7d.get(app, 0); c24h = svc_apps_24h.get(app, 0)
                      lines.append(f"| {app} | {count} | {c7d} | {c24h} |")
                  lines.append("")
                  if svc_app_models:
                      lines += ["#### Application by Model", "", "| Application | Model / Engine | Past 365 Calendar Days | Last 7 Calendar Days | Today |", "|-------------|----------------|------------------------|--------------------|-------|"]
                      for (app, model), count in sorted(svc_app_models.items(), key=lambda item: (-item[1], item[0])):
                          c7d = svc_app_models_7d.get((app, model), 0)
                          today = svc_app_models_today.get((app, model), 0)
                          display_model = "Baidu OCR" if model == "baidu/Unlimited-OCR" else model
                          lines.append(f"| {app} | {display_model} | {count} | {c7d} | {today} |")
                      lines.append("")
                  for i, (app, count) in enumerate(sorted_apps[:15]): lines.append(badge(app, f"{count}_calls", APP_COLORS[i % len(APP_COLORS)]))
                  lines.append("")
              lines.append("")

          content = README.read_text(encoding="utf-8")
          if HEADER in content:
              start = content.index(HEADER); rest = content[start+len(HEADER):]
              match = re.search(r'\n(## |---)', rest)
              end = start + len(HEADER) + (match.start() if match else len(rest))
              content = content[:start].rstrip() + "\n\n" + "\n".join(lines) + "\n" + content[end:].lstrip()
              README.write_text(content, encoding="utf-8")
          PYEOF

      - name: Commit updated README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          [ -d assets ] && git add assets/*.svg 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update request statistics [skip ci]"
            git push
          fi
