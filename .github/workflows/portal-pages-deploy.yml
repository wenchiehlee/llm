name: Deploy Llm-Deck portal to Synology

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-deck-portal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static portal to /web/llm
    runs-on: [Linux, x64, gpu, Self-hosted]
    timeout-minutes: 10
    steps:
      - name: Checkout Llm-Deck
        uses: actions/checkout@v4

      - name: Check NAS path and portal files
        shell: bash
        run: |
          set -euo pipefail
          command -v rsync
          test -d /web
          test -s portal/index.html
          test -s portal/assets/site.css
          mkdir -p /web/llm

      - name: Deploy Llm-Deck portal to Synology Web Station
        shell: bash
        run: |
          set -euo pipefail
          rsync --archive --delete -- portal/ /web/llm/
          test -s /web/llm/index.html
          grep -q 'Llm-Deck' /web/llm/index.html
